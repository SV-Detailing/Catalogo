<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Productos profesionales de car detailing de las mejores marcas. Pedidos por WhatsApp. La Rioja, Argentina.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="img/logo/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">

    <div class="contenedor">
      <div class="destacados__cabecera">
        <h2 class="titulo-oscuro">Productos Destacados</h2>

      </div>
      <div id="destacados" class="destacados" aria-live="polite"></div>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="js/config.js"></script>
  <script src="js/datos-ejemplo.js"></script>
